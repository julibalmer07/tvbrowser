# Baut den Browser auf einem Mac in der Cloud, startet ihn im
# Apple-TV-Simulator und macht Screenshots. Ergebnis: unter "Actions"
# den Lauf öffnen, ganz unten bei "Artifacts" die Datei "apple-tv-test" laden.

name: Apple TV Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [xcode-27, macos-26]   # tvOS 27 bzw. tvOS 26
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: |
          xcode-select -p
          xcodebuild -version
          mkdir -p ergebnis
          xcodebuild -version > ergebnis/xcode-version.txt

      - name: Für den Simulator kompilieren
        run: |
          set -o pipefail
          xcodebuild -project TVBrowser.xcodeproj -target TVBrowser \
            -sdk appletvsimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tee ergebnis/build-simulator.log

      - name: Für ein echtes Apple TV kompilieren (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -project TVBrowser.xcodeproj -target TVBrowser \
            -sdk appletvos -configuration Debug \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tee ergebnis/build-device.log

      - name: tvOS-Simulator bereitstellen
        run: |
          if ! xcrun simctl list runtimes | grep -q "tvOS"; then
            echo "Kein tvOS-Simulator vorhanden – lade ihn herunter …"
            xcodebuild -downloadPlatform tvOS
          fi
          xcrun simctl list runtimes | tee ergebnis/simulatoren.txt

      - name: Im Simulator starten und Screenshots machen
        run: |
          # Ein vorhandenes, zur neuesten tvOS-Version passendes Apple TV suchen.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [k for k in devices if "tvOS" in k and devices[k]]
          runtimes.sort(key=lambda k: [int(x) for x in k.split("tvOS-")[1].split("-")])
          print(devices[runtimes[-1]][-1]["udid"] if runtimes else "")
          ')
          # Sonst selbst eines anlegen – mit dem ersten Modell, das passt.
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="tvOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
            for DT in $(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print("\n".join(t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if "Apple-TV" in t["identifier"]))' | tail -r); do
              UDID=$(xcrun simctl create "Test-Apple-TV" "$DT" "$RUNTIME" 2>/dev/null) && break
            done
          fi
          echo "Simulator:"; xcrun simctl list devices | grep "$UDID" | tee ergebnis/simulator.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find build -type d -name "TVBrowser.app" -path "*appletvsimulator*" | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "App: $APP ($BUNDLE_ID)"

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"

          sleep 25
          xcrun simctl io "$UDID" screenshot ergebnis/1-nach-25-sekunden.png
          sleep 30
          xcrun simctl io "$UDID" screenshot ergebnis/2-nach-55-sekunden.png

          # Prüfen, ob die App noch läuft (nicht abgestürzt).
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "App läuft noch ✅" | tee ergebnis/status.txt
          else
            echo "App läuft NICHT mehr ❌ (abgestürzt?)" | tee ergebnis/status.txt
          fi

          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "TVBrowser"' > ergebnis/app-log.txt || true

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-test-${{ matrix.image }}
          path: ergebnis
